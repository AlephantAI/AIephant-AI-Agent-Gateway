telemetry:
  level: "info,ai_gateway=trace"
  exporter: both

alephant:
  log-collector-url: "http://localhost:8585"
  features: all

agent:
  enabled: true
  allow-header-context: true
  event-stream-key: "lc:stream:alephant-agent-events"
  event-log-http-fallback-enabled: true
  event-log-http-endpoint: "/v1/log/agent-event"
  event-log-http-timeout-ms: 1000
  context-conflict-action: warn
  step-conflict-action: warn
  metadata-redaction: basic
  policy-mode: audit
  tools:
    enabled: false
    catalog-source: static
    redis-active-pointer-prefix: "alephant:agent-tools:v1"
    snapshot-cache-ttl-ms: 60000
    require-policy-decision: true
    fail-open-for-static-targets: false
    schema-validation-enabled: true
    idempotency-ttl-seconds: 3600
    response-mode: http-strict
    redis-timeout-ms: 1000
    policy-timeout-ms: 3000
    max-concurrent-per-workspace: 32
    timeout-ms: 8000
    max-request-bytes: 65536
    max-response-bytes: 65536
    egress-policy:
      https-only: true
      block-loopback: true
      block-link-local: true
      block-metadata-ip: true
      block-private-network: true
      allow-environment-proxy: false
    targets: []

routers:
  latency:
    load-balance:
      chat:
        strategy: model-latency
        models:
          - openai/gpt-4o-mini
          - anthropic/claude-3-7-sonnet
  my-router:
    load-balance:
      chat:
        strategy: model-latency
        models:
          - bedrock/anthropic.claude-3-7-sonnet-v1:0
          - anthropic/claude-3-7-sonnet

