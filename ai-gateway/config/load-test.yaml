providers:
  openai:
    base-url: "http://alephant-mock-server.internal:5150"
  anthropic:
    base-url: "http://alephant-mock-server.internal:5150"
  gemini:
    base-url: "http://alephant-mock-server.internal:5150"
  bedrock:
    base-url: "http://alephant-mock-server.internal:5150"

s3:
  endpoint: "http://alephant-mock-server.internal:5150"
  bucket-name: "request-response-storage"
  access-key: "minioadmin"
  secret-key: "minioadmin"

alephant:
  log-collector-url: "http://alephant-mock-server.internal:5150"
  features: auth

agent:
  enabled: true
  allow-header-context: true
  event-stream-key: "lc:stream:alephant-agent-events"
  event-log-http-fallback-enabled: true
  event-log-http-endpoint: "/v1/log/agent-event"
  event-log-http-timeout-ms: 1000
  context-conflict-action: warn
  step-conflict-action: warn
  metadata-redaction: basic
  policy-mode: audit

telemetry:
  level: info
  exporter: both
  otlp-endpoint: "http://alephant-otel-collector.internal:4317/v1/metrics"
